[project]
name = "mt5-gateway"
version = "0.1.0"
description = "HTTP API wrapper around MetaTrader 5"
requires-python = ">=3.9"

# Runtime deps live in app/requirements.txt (installed into the Wine Python at
# build time). Test-only deps live in requirements-dev.txt — the MetaTrader5
# package is Windows-only, so tests run against a fake injected in
# tests/conftest.py.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
