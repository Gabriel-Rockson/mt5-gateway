services:
  mt5:
    build:
      dockerfile: Dockerfile
    container_name: mt5-gateway
    volumes:
      - ./config:/config
    networks:
      - default
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "${MT5_GATEWAY_VNC_PORT:-10004}:3000"
      - "${MT5_GATEWAY_API_PORT:-10003}:5001"

    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "10", "http://localhost:5001/health/live"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 300s

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

networks:
  default:
    driver: bridge
